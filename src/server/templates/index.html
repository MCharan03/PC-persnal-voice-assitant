<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHERRY // SENTIENT OS</title>
    
    <!-- Socket.IO Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="hud-container">
        <!-- Visualizer Layer (Background) -->
        <div id="visualizer-container">
            <canvas id="audio-vis" width="300" height="300"></canvas>
        </div>

        <!-- Output Layer (Foreground) -->
        <div id="output-area">
            <!-- Messages inject here -->
        </div>

        <!-- Status Footer -->
        <div id="status-bar">
            <div>CHERRY V2.0</div>
            <div id="status-text" class="blink">INITIALIZING...</div>
            <div>MEM: 46%</div>
        </div>
        
        <!-- Push to Talk (Temporary until VAD is perfect) -->
        <button id="mic-trigger">🎙️</button>
    </div>

    <!-- Custom Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</html>
